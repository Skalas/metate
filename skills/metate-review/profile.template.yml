# .metate/profile.yml — per-repo config for the `metate` pipeline.
# The skill engines are codebase-agnostic; everything project-specific lives here.
# The `metate` wizard skill fills the gates and the rest with detected defaults.

# --- gates ---------------------------------------------------------------
# Placeholders fail loudly — run the `metate` wizard skill to detect the real gates.
fastGate: "echo 'fastGate not set — run the metate wizard skill' && false"   # quick loop, run after each review round
shipGate: "echo 'shipGate not set — run the metate wizard skill' && false"   # full pre-PR gate (mirrors CI)

# --- reviewer (parallel lenses; spawned as other-harness CLIs) ------------
# The orchestrator is whichever agent harness you open. Reviewers are separate
# subprocesses — see metate-review/REVIEWERS.md. Optional per-lens overrides:
reviewer:
  backend: claude          # codex | cursor | claude
  # correctness: codex
  # security: codex
  # elegance: codex

# --- implementer (the only writer) ---------------------------------------
implementer:
  backend: cursor          # cursor | codex | claude | gemini
  model: ""                # e.g. composer-2.5 (blank = adapter default)
  autonomous: false        # claude backend only. true → bootstrap whitelists `Bash(claude -p:*)`
                           # in .claude/settings.local.json (personal, gitignored) so headless
                           # rounds don't prompt. Trade-off: removes the per-call approval gate on
                           # the nested implementer. cursor/codex gate writes via their own flags.

sessionFile: ".metate/session.json"
issueLedger: ".metate/issues.json"   # issues filed by prep, read by ship for auto-close
signalsFile: ".metate/signals.json"  # tier-1 captures from smoke + review; read + dispositioned by discover
isolation: none            # none | worktree

# --- codebase memory (required structural context provider) ---------------
# codebase-memory-mcp is a REQUIRED prerequisite (install/bootstrap abort without
# it). This flag only toggles whether review USES the graph: when enabled, review
# sub-agents prefer the knowledge graph over grep/Read for structural discovery.
codebaseMemory:
  enabled: true            # default on; the repo must be indexed (bootstrap prints the index command)
  reindex: git             # git | always | manual — refresh the graph between rounds after patches
  indexCommand: ""         # blank = rely on the auto_index git watcher; else an explicit reindex command

# --- review (metate-review) -----------------------------------------------
# What reviewers must scrutinize in THIS codebase. Replace with your real invariants.
reviewFocus: |
  - <invariant 1, e.g. tenant/scope isolation on every transactional query>
  - <invariant 2, e.g. money math at the cent in the payment path>
  - <invariant 3, e.g. state transitions go through the domain guard>
  - The implementer is the ONLY code writer; reviewers report findings and the orchestrator
    verifies or routes them to the implementer — the orchestrator may Write ONLY to
    `signalsFile` and `prep.techDebtFile` to persist capture survivors.

# Which buckets the implementer auto-fixes each round. Reporting is unconditional.
#   blockers           — only blockers fixed; warnings + DESIGN reported  (safest, default)
#   blockers+warnings  — blockers + warnings fixed; DESIGN reported
#   all                — blockers + warnings + DESIGN fixed (most churn)
review:
  autoFix: blockers

# --- discover (metate-discover) -------------------------------------------
discover:
  sources:
    aftercare: true
    codebaseMemory: true
    issues: true
    gitHistory: true
    captures: true
  planFile: ".metate/plan.md"
  candidates: 5

# --- prep (metate-prep) ---------------------------------------------------
prep:
  baseBranch: main
  readingOrder: []
  techDebtFile: ""
  issues:
    create: true
    tracker: github
    granularity: test-matrix
    labels: ["sprint"]
    milestone: ""

# --- smoke (metate-smoke) -------------------------------------------------
# Optional human-validation gates (H1…Hn beside the T1…Tn DoD matrix). When set,
# prep seeds the ledger from the plan; smoke walks the human through open items
# (explain why / what to do / what approved means — never a bare H1…Hn list);
# ship refuses to open a PR while any item is `open` if required: true.
# Ledger entry shape: id, title, type (ux|live|graduation|other),
# status (open|approved|deferred), reason, sprint, date.
smoke:
  command: ""
  seedCommand: ""
  # humanGates:
  #   ledger: .metate/human-gates.json
  #   required: true

# --- aftercare (metate-aftercare) -----------------------------------------
# Optional release gate: when the repo already publishes semver tags / GitHub
# Releases, aftercare proposes patch|minor|major from the sprint diff and stops
# for confirmation; ship cuts the tag (+ optional gh release) only after merge
# and a second confirmation. Leave enabled:false (or omit) when the project has
# no versioning scheme — do not invent one.
aftercare:
  deliverables: []
  postCommand: ""          # optional; run after deliverables sync (e.g. regenerate docs)
  # release:
  #   enabled: true
  #   scheme: semver
  #   tagPrefix: "v"
  #   currentFrom: git-tag   # git-tag | file
  #   githubRelease: true
  #   planFile: .metate/release.json
  #   bumpFiles: []          # optional paths to bump on approve (e.g. package.json)

# --- ship (metate-ship) ---------------------------------------------------
ship:
  prTarget: main
  commitStyle: "conventional, bisectable, one per layer"
  issueCloseKeyword: "Closes"
